<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --abyss:#0B1A2A;
  --chart:#10273C;
  --rule:#1E3D5A;
  --brass:#E8B04B;
  --brass-dim:#8a6a2c;
  --aqua:#6FD3C6;
  --paper:#F2EFE6;
  --muted:#93A8BC;
  --shadow:0 24px 60px -20px rgba(0,0,0,.75);
  --ledger-w:390px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--abyss);
  color:var(--paper);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px;border-radius:2px}

/* ---------- Kopfzeile ---------- */
.masthead{
  display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;
  padding:14px 22px 12px;
  border-bottom:1px solid var(--rule);
  background:linear-gradient(180deg,#0d1f31,#0B1A2A);
}
.mark{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.eyebrow{
  font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);
}
.mark h1{
  margin:0;font-family:'Bodoni Moda',Georgia,serif;font-weight:700;
  font-size:clamp(21px,2.6vw,30px);line-height:1.05;letter-spacing:-.01em;
}
.mark h1 em{font-style:italic;font-weight:500;color:var(--brass)}
.stats{display:flex;gap:26px;flex-wrap:wrap;padding-bottom:3px}
.stat b{
  display:block;font-family:'Bodoni Moda',Georgia,serif;font-size:22px;font-weight:700;line-height:1;
}
.stat span{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);
}

/* ---------- Bühne ---------- */
.stage{
  display:grid;grid-template-columns:1fr var(--ledger-w);
  height:calc(100dvh - var(--head-h,74px));
}
.chart{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--rule)}
#map{flex:1;min-height:0;background:#0a1826}
.leaflet-container{font-family:'Archivo',sans-serif;background:#0a1826}
.leaflet-control-attribution{
  background:rgba(11,26,42,.82)!important;color:var(--muted)!important;font-size:10px!important;
}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-bar a{background:#12293e!important;color:var(--paper)!important;border-color:var(--rule)!important}
.leaflet-bar a:hover{background:#1a3750!important}
.leaflet-tooltip.port-tip{
  background:#0d2137;border:1px solid var(--rule);color:var(--paper);
  box-shadow:var(--shadow);font-size:12px;padding:5px 9px;border-radius:3px;
}
.leaflet-tooltip.port-tip::before{display:none}
.leaflet-tooltip.port-tip b{font-weight:600}
.leaflet-tooltip.port-tip i{
  font-style:normal;display:block;font-family:'IBM Plex Mono',monospace;
  font-size:10px;color:var(--brass);letter-spacing:.08em;
}

/* Kartenwerkzeuge */
.chart-tools{position:absolute;z-index:500;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
.tool{
  background:rgba(13,33,55,.9);border:1px solid var(--rule);border-radius:3px;
  padding:7px 11px;font-size:11.5px;letter-spacing:.04em;color:var(--paper);
  backdrop-filter:blur(6px);transition:border-color .15s,color .15s;
}
.tool:hover{border-color:var(--brass);color:var(--brass)}
.chart-wrap{position:relative;flex:1;min-height:0;display:flex}

/* ---------- Reise-Log (Signature) ---------- */
.log{
  border-top:1px solid var(--rule);background:#0d2035;
  padding:9px 16px 11px;overflow-x:auto;overflow-y:hidden;
}
.log-inner{min-width:760px}
.log-months,.log-days{display:grid;grid-template-columns:repeat(141,1fr);gap:2px}
.log-months{margin-bottom:5px}
.log-months span{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);border-left:1px solid var(--rule);padding-left:5px;white-space:nowrap;overflow:hidden;
}
.log-days{height:34px;align-items:end}
.day{
  height:34%;background:#1c3a55;border:0;padding:0;border-radius:1px;
  transition:height .18s ease,background .18s ease;
}
.day.port{height:100%;background:var(--brass-dim)}
.day.port.multi{background:var(--brass)}
.day:hover,.day:focus-visible{background:var(--aqua);height:100%}
.day.is-active{background:var(--paper);height:100%}
.log-legend{
  display:flex;gap:18px;align-items:center;margin-top:8px;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.log-legend i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:-1px;border-radius:1px}

/* ---------- Ledger ---------- */
.ledger{position:relative;display:flex;flex-direction:column;min-height:0;background:#0c1e30}
.ledger-head{padding:13px 16px 11px;border-bottom:1px solid var(--rule);display:flex;gap:9px;align-items:center}
.search{
  flex:1;background:#0a1826;border:1px solid var(--rule);border-radius:3px;
  padding:8px 11px;color:var(--paper);font-size:13.5px;
}
.search::placeholder{color:#5f7891}
.search:focus{outline:none;border-color:var(--brass)}
.switch{
  border:1px solid var(--rule);border-radius:3px;padding:8px 10px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap;
}
.switch[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}

.stops{list-style:none;margin:0;padding:0 0 40px;overflow-y:auto;flex:1}
.stop{
  display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:baseline;
  width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid rgba(30,61,90,.55);
  transition:background .14s ease;
}
.stop:hover{background:#102a41}
.stop.is-active{background:#13324c;box-shadow:inset 3px 0 0 var(--brass)}
.stop .day-no{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--brass);padding-top:3px;
}
.stop .day-no small{display:block;color:var(--muted);letter-spacing:.04em;font-size:9.5px;margin-top:3px}
.stop .name{font-size:15.5px;font-weight:500;letter-spacing:-.005em}
.stop .sub{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);
  letter-spacing:.06em;margin-top:3px;display:block;
}
.stop .dur{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--paper);white-space:nowrap;padding-top:2px}
.stop .dur em{font-style:normal;display:block;font-size:9.5px;color:var(--brass);letter-spacing:.1em;text-align:right;margin-top:3px}
.sea{
  display:flex;align-items:center;gap:10px;padding:7px 16px 7px 68px;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:#5f7891;border-bottom:1px solid rgba(30,61,90,.35);
}
.sea::before{content:"";flex:0 0 22px;height:1px;background:repeating-linear-gradient(90deg,var(--rule) 0 3px,transparent 3px 6px)}
.empty{padding:28px 18px;color:var(--muted);font-size:13.5px}

/* ---------- Detailblatt ---------- */
.sheet{
  position:absolute;inset:0;background:#0c1e30;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  visibility:hidden;z-index:20;
}
.sheet.is-open{transform:translateX(0);visibility:visible}
.sheet-scroll{overflow-y:auto;flex:1}
.back{
  display:flex;align-items:center;gap:8px;padding:12px 16px;width:100%;
  border-bottom:1px solid var(--rule);font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
.back:hover{color:var(--brass)}
.hero{position:relative;aspect-ratio:16/10;background:#102a41;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s ease}
.hero img.is-loaded{opacity:1}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(12,30,48,0) 40%,rgba(12,30,48,.95));
}
.hero figcaption{
  position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px;
}
.hero .region{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--brass);
}
.hero h2{
  margin:5px 0 0;font-family:'Bodoni Moda',Georgia,serif;font-weight:700;
  font-size:29px;line-height:1.05;letter-spacing:-.015em;
}
.hero .country{font-size:12.5px;color:var(--muted);margin-top:4px}
.hero .placeholder{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:#3c5a76;
  background:radial-gradient(120% 100% at 30% 0%,#173553,#0e2439);
}
.facts{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--rule)}
.fact{padding:13px 16px;border-right:1px solid var(--rule);border-top:1px solid var(--rule)}
.fact:nth-child(2n){border-right:0}
.fact span{
  display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px;
}
.fact b{font-weight:500;font-size:14.5px}
.body{padding:16px}
.body p{margin:0 0 14px;font-size:14.5px;color:#dfe6ec}
.body h3{
  margin:20px 0 9px;font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--brass);font-weight:500;
}
.body ul{margin:0;padding:0;list-style:none}
.body li{
  padding:7px 0 7px 16px;border-bottom:1px solid rgba(30,61,90,.5);font-size:14px;position:relative;
}
.body li::before{content:"—";position:absolute;left:0;color:var(--brass-dim)}
.hint{
  margin-top:16px;padding:11px 13px;border-left:2px solid var(--brass);
  background:#102a41;font-size:13px;color:#cfd9e2;
}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.links a{
  border:1px solid var(--rule);border-radius:3px;padding:8px 12px;font-size:12px;
  color:var(--paper);text-decoration:none;transition:border-color .15s,color .15s;
}
.links a:hover{border-color:var(--brass);color:var(--brass)}
.credit{
  padding:14px 16px 26px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  letter-spacing:.1em;color:#4d6b87;
}

/* ---------- Mobil ---------- */
@media (max-width:940px){
  body{overflow:auto}
  .masthead{padding:12px 16px 10px;gap:16px}
  .stats{gap:18px}
  .stage{display:block;height:auto}
  .chart{border-right:0;border-bottom:1px solid var(--rule)}
  .chart-wrap{height:52dvh}
  .ledger{min-height:60dvh}
  .sheet{position:fixed;inset:0;transform:translateY(100%)}
  .sheet.is-open{transform:translateY(0)}
  .stops{overflow:visible}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>

/* =======================================================================
   2 · Datums- und Formathelfer
   ===================================================================== */
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MO = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const MO_LONG = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

const dateOf = d => new Date(START + (d - 1) * 86400000);
const fmtShort = d => { const x = dateOf(d); return `${x.getUTCDate()}. ${MO[x.getUTCMonth()]}`; };
const fmtFull  = d => { const x = dateOf(d); return `${WD[x.getUTCDay()]}, ${x.getUTCDate()}. ${MO[x.getUTCMonth()]} ${x.getUTCFullYear()}`; };
const toMin = t => t ? (+t.slice(0,2)) * 60 + (+t.slice(3)) : null;

function hours(call){
  if(!call.arr || !call.dep) return null;
  return ((call.d2 - call.d1) * 1440 + toMin(call.dep) - toMin(call.arr)) / 60;
}
function fmtDur(h){
  if(h === null) return "—";
  if(h < 24) return `${Math.round(h)} Std.`;
  const d = Math.floor(h / 24), rest = Math.round(h - d * 24);
  return rest ? `${d} Tg. ${rest} Std.` : `${d} Tage`;
}

const seaDayCount = TOTAL_DAYS - portDays.size;
const daysToGo = Math.ceil((START - Date.now()) / 86400000);

document.getElementById("stats").innerHTML = [

/* =======================================================================
   4 · Karte
   ===================================================================== */
const map = L.map("map", {
  worldCopyJump:true, minZoom:2, maxZoom:12, zoomControl:true,
  attributionControl:true, scrollWheelZoom:true
});
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  attribution:'&copy; OpenStreetMap, &copy; CARTO · Reisedaten: eigene Buchung',
  subdomains:"abcd", maxZoom:19
}).addTo(map);

/* Route: Segmente am 180. Längengrad sauber teilen */
const routeSegments = [];
for(let i = 0; i < CALLS.length - 1; i++){
  const a = CALLS[i], b = CALLS[i + 1];
  let lon2 = b.lon, d = lon2 - a.lon;
  if(d > 180) lon2 -= 360; else if(d < -180) lon2 += 360;
  if(lon2 >= -180 && lon2 <= 180){
    routeSegments.push([[a.lat, a.lon], [b.lat, b.lon]]);
  } else {
    const edge = lon2 > 180 ? 180 : -180;
    const t = (edge - a.lon) / (lon2 - a.lon);
    const latX = a.lat + t * (b.lat - a.lat);
    routeSegments.push([[a.lat, a.lon], [latX, edge]]);
    routeSegments.push([[latX, -edge], [b.lat, b.lon]]);
  }
}
L.polyline(routeSegments, {color:"#E8B04B", weight:7, opacity:.10}).addTo(map);
L.polyline(routeSegments, {color:"#E8B04B", weight:1.6, opacity:.85, dashArray:"1 5", lineCap:"round"}).addTo(map);

const markers = CALLS.map((c, i) => {
  const long = (hours(c) || 0) > 24;
  const m = L.circleMarker([c.lat, c.lon], {
    radius: long ? 6 : 4.5, color:"#0B1A2A", weight:1.5,
    fillColor:"#E8B04B", fillOpacity:1
  }).addTo(map);
  m.bindTooltip(`<b>${c.n}</b><i>Tag ${c.d1}${c.d2 > c.d1 ? "–" + c.d2 : ""} · ${fmtShort(c.d1)}</i>`,
    {className:"port-tip", direction:"top", offset:[0, -6]});
  m.on("click", () => select(i, true));
  return m;
});
const halo = L.circleMarker([0, 0], {
  radius:12, color:"#6FD3C6", weight:2, fill:false, opacity:0, interactive:false
}).addTo(map);

const allBounds = L.latLngBounds(CALLS.map(c => [c.lat, c.lon]));
const fitAll = () => map.fitBounds(allBounds, {padding:[40, 40]});
fitAll();
document.getElementById("fitBtn").addEventListener("click", () => { fitAll(); });

/* =======================================================================
   5 · Routenliste
   ===================================================================== */
const stopsEl = document.getElementById("stops");
let showSea = true, query = "", activeIdx = -1;

function renderList(){
  const q = query.trim().toLowerCase();
  let html = "", shown = 0;

  CALLS.forEach((c, i) => {
    const match = !q || c.n.toLowerCase().includes(q) || c.c.toLowerCase().includes(q) || c.r.toLowerCase().includes(q);

    if(showSea && !q && i > 0){
      const gap = c.d1 - CALLS[i - 1].d2 - 1;
      if(gap > 0){
        html += `<li class="sea">${gap} ${gap === 1 ? "Seetag" : "Seetage"} · ${fmtShort(CALLS[i-1].d2+1)} – ${fmtShort(c.d1-1)}</li>`;
      }
    }
    if(!match) return;
    shown++;

    const h = hours(c);
    const times = c.type === "start" ? `Ablegen ${c.dep}`
              : c.type === "end"   ? `Ankunft ${c.arr}`
              : `${c.arr} – ${c.dep}`;
    html += `<li><button class="stop${i === activeIdx ? " is-active" : ""}" data-i="${i}">
        <span class="day-no">TAG ${c.d1}${c.d2 > c.d1 ? "–" + c.d2 : ""}<small>${fmtShort(c.d1)}</small></span>
        <span><span class="name">${c.n}</span><span class="sub">${c.c}</span></span>
        <span class="dur">${times}<em>${h === null ? (c.type === "start" ? "Start" : "Ziel") : fmtDur(h)}</em></span>
      </button></li>`;
  });

  stopsEl.innerHTML = shown ? html : `<li class="empty">Kein Hafen gefunden. Suchbegriff anpassen oder Feld leeren.</li>`;
}
stopsEl.addEventListener("click", e => {
  const btn = e.target.closest(".stop");
  if(btn) select(+btn.dataset.i, true);
});
document.getElementById("search").addEventListener("input", e => { query = e.target.value; renderList(); });
const seaBtn = document.getElementById("seaToggle");
seaBtn.addEventListener("click", () => {
  showSea = !showSea;
  seaBtn.setAttribute("aria-pressed", String(showSea));
  renderList();
});

/* =======================================================================
   6 · Reise-Log (Tagesband)
   ===================================================================== */
const dayOwner = new Array(TOTAL_DAYS + 1).fill(-1);
CALLS.forEach((c, i) => { for(let d = c.d1; d <= c.d2; d++) dayOwner[d] = i; });

const monthsEl = document.getElementById("logMonths");
const daysEl = document.getElementById("logDays");
let mHtml = "", start = 1;
for(let d = 1; d <= TOTAL_DAYS; d++){
  const isLast = d === TOTAL_DAYS;
  const changes = !isLast && dateOf(d + 1).getUTCMonth() !== dateOf(d).getUTCMonth();
  if(changes || isLast){
    const x = dateOf(start), span = d - start + 1;
    mHtml += `<span style="grid-column:${start} / span ${span}">${MO_LONG[x.getUTCMonth()].slice(0,3)}</span>`;
    start = d + 1;
  }
}
monthsEl.innerHTML = mHtml;

daysEl.innerHTML = Array.from({length:TOTAL_DAYS}, (_, k) => {
  const d = k + 1, idx = dayOwner[d], c = idx >= 0 ? CALLS[idx] : null;
  const cls = c ? (c.d2 > c.d1 ? "day port multi" : "day port") : "day";
  const label = c ? `Tag ${d}, ${fmtFull(d)} · ${c.n}` : `Tag ${d}, ${fmtFull(d)} · Seetag`;
  return `<button class="${cls}" data-day="${d}" data-i="${idx}" title="${label}" aria-label="${label}"></button>`;
}).join("");

daysEl.addEventListener("click", e => {
  const b = e.target.closest(".day");
  if(!b) return;
  const i = +b.dataset.i;
  if(i >= 0) select(i, true);
  else document.getElementById("logHint").textContent = `Tag ${b.dataset.day}: Seetag, ${fmtFull(+b.dataset.day)}`;
});

function markLogDays(i){
  daysEl.querySelectorAll(".day.is-active").forEach(el => el.classList.remove("is-active"));
  if(i < 0) return;
  const c = CALLS[i];
  for(let d = c.d1; d <= c.d2; d++){
    const el = daysEl.querySelector(`.day[data-day="${d}"]`);
    if(el) el.classList.add("is-active");
  }
}

/* =======================================================================
   7 · Detailblatt
   ===================================================================== */
const sheet = document.getElementById("sheet");
const sheetBody = document.getElementById("sheetBody");
const imgCache = new Map();

async function wikiImage(title){
  if(imgCache.has(title)) return imgCache.get(title);
  const langs = ["de", "en"];
  for(const lang of langs){
    try{
      const res = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
      if(!res.ok) continue;
      const data = await res.json();
      const src = data.thumbnail && data.thumbnail.source;
      if(src){
        const big = src.replace(/\/\d+px-/, "/1000px-");
        const out = {src:big, page:data.content_urls && data.content_urls.desktop.page};
        imgCache.set(title, out);
        return out;
      }
    }catch(e){ /* offline oder blockiert: Platzhalter zeigen */ }
  }
  imgCache.set(title, null);
  return null;
}

function renderSheet(i){
  const c = CALLS[i], h = hours(c);
  const dateLine = c.d2 > c.d1 ? `${fmtFull(c.d1)} – ${fmtFull(c.d2)}` : fmtFull(c.d1);
  const timeLine = c.type === "start" ? `Ablegen ${c.dep}` : c.type === "end" ? `Ankunft ${c.arr}` : `${c.arr} – ${c.dep} Uhr`;

  sheetBody.innerHTML = `
    <figure class="hero" id="hero">
      <div class="placeholder">Bild wird geladen</div>
      <figcaption>
        <div class="region">Tag ${c.d1}${c.d2 > c.d1 ? "–" + c.d2 : ""} · ${c.r}</div>
        <h2>${c.n}</h2>
        <div class="country">${c.c}</div>
      </figcaption>
    </figure>
    <div class="facts">
      <div class="fact"><span>Datum</span><b>${dateLine}</b></div>
      <div class="fact"><span>Liegezeit</span><b>${timeLine}</b></div>
      <div class="fact"><span>Dauer an Land</span><b>${h === null ? "—" : fmtDur(h)}</b></div>
      <div class="fact"><span>Position</span><b style="font-family:'IBM Plex Mono',monospace;font-size:12.5px">${c.lat.toFixed(3)}, ${c.lon.toFixed(3)}</b></div>
    </div>
    <div class="body">
      <p>${c.t}</p>
      <h3>Nicht versäumen</h3>
      <ul>${c.h.map(x => `<li>${x}</li>`).join("")}</ul>
      ${c.note ? `<p class="hint">${c.note}</p>` : ""}
      <div class="links">
        <a href="https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lon}" target="_blank" rel="noopener">In Google Maps öffnen</a>
        <a href="https://de.wikipedia.org/wiki/${encodeURIComponent(c.w)}" target="_blank" rel="noopener">Wikipedia</a>
      </div>
      <p class="credit">Bild: Wikipedia / Wikimedia Commons</p>
    </div>`;

  const hero = document.getElementById("hero");
  wikiImage(c.w).then(res => {
    if(!res || sheetBody.dataset.i != i) {
      if(!res) hero.querySelector(".placeholder").textContent = c.n;
      return;
    }
    const img = new Image();
    img.alt = c.n;
    img.src = res.src;
    img.addEventListener("load", () => {
      img.classList.add("is-loaded");
      const ph = hero.querySelector(".placeholder");
      if(ph) ph.remove();
    });
    hero.insertBefore(img, hero.firstChild);
  });
  sheetBody.dataset.i = i;
}

function select(i, fly){
  activeIdx = i;
  renderList();
  markLogDays(i);
  renderSheet(i);
  sheet.classList.add("is-open");

  const c = CALLS[i];
  halo.setLatLng([c.lat, c.lon]).setStyle({opacity:.9});
  markers.forEach((m, k) => m.setStyle({fillColor: k === i ? "#6FD3C6" : "#E8B04B"}));
  if(fly) map.flyTo([c.lat, c.lon], Math.max(map.getZoom(), 5), {duration:.9});

  const row = stopsEl.querySelector(`.stop[data-i="${i}"]`);
  if(row) row.scrollIntoView({block:"nearest"});
}

function closeSheet(){
  sheet.classList.remove("is-open");
  activeIdx = -1;
  halo.setStyle({opacity:0});
  markers.forEach(m => m.setStyle({fillColor:"#E8B04B"}));
  markLogDays(-1);
  renderList();
}
document.getElementById("backBtn").addEventListener("click", closeSheet);
addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });

/* Nächster Hafen ab heute */
document.getElementById("nextBtn").addEventListener("click", () => {
  const today = Math.floor((Date.now() - START) / 86400000) + 1;
  const idx = CALLS.findIndex(c => c.d2 >= today);
  select(idx < 0 ? CALLS.length - 1 : idx, true);
});

renderList();
</script>
</body>
</html>
