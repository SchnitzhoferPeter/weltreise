name: Hafenbilder holen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bilder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bilder von Wikipedia/Commons laden
        run: node scripts/fetch-images.mjs
      - name: Ins Repository übernehmen
        run: |
          git config user.name "weltreise-bilder"
          git config user.email "actions@users.noreply.github.com"
          git add img data/bilder.json
          if git diff --cached --quiet; then echo "Keine Änderung."; else
            git commit -qm "Hafenbilder aktualisiert"
            git push
          fi
